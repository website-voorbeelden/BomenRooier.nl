<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">

  <title>Pagina niet gevonden | BomenRooier</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f0f7ef;
      color: #15201a;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 620px);
      padding: 48px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 22px 60px rgba(9, 47, 32, 0.14);
      text-align: center;
    }

    .logo-link {
      display: inline-block;
      margin-bottom: 35px;
    }

    .logo {
      display: block;
      width: 210px;
      max-width: 100%;
      height: auto;
    }

    .code {
      color: #19643f;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 14px;
      font-size: clamp(2rem, 8vw, 3.6rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 28px;
      color: #59665e;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border-radius: 12px;
      color: #ffffff;
      background: #d96317;
      font-weight: 800;
      text-decoration: none;
      transition:
        background-color 0.2s ease,
        transform 0.2s ease;
    }

    .button:hover {
      background: #b94f0d;
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(217, 99, 23, 0.3);
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      .card {
        padding: 35px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <a class="logo-link" href="/" aria-label="Ga naar de homepage van BomenRooier">
      <img
        class="logo"
        src="/assets/icons/logo-bomenrooier.svg"
        width="210"
        height="52"
        alt="BomenRooier"
      >
    </a>

    <div class="code">Fout 404</div>

    <h1>Deze pagina bestaat niet</h1>

    <p>
      De pagina die u probeert te openen is mogelijk verplaatst of bestaat niet.
      Ga terug naar de homepage om onze diensten te bekijken of een vrijblijvende
      offerte aan te vragen.
    </p>

    <a class="button" href="/">Terug naar de homepage</a>
  </main>
</body>
</html>
